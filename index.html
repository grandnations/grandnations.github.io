<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>United Nations IV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #070707;
    --bg-soft: #0f0f0f;
    --ink: #f2f2ee;
    --ink-dim: #9b9b95;
    --ink-faint: #5c5c58;
    --line: rgba(242,242,238,0.14);
    --line-strong: rgba(242,242,238,0.28);
    --glass: rgba(242,242,238,0.045);
    --glass-hover: rgba(242,242,238,0.08);
    --serif: 'Fraunces', serif;
    --sans: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --maxw: 1120px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(242,242,238,0.06), transparent 60%),
      radial-gradient(ellipse 700px 600px at 100% 10%, rgba(242,242,238,0.04), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{background:var(--ink); color:var(--bg);}

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}

  /* NAV */
  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:rgba(7,7,7,0.55);
    backdrop-filter:blur(14px) saturate(120%);
    -webkit-backdrop-filter:blur(14px) saturate(120%);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:var(--maxw); margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:1.05rem; letter-spacing:0.02em;}
  .nav-brand svg{width:26px; height:26px; flex-shrink:0;}
  nav.links{display:flex; gap:28px; font-size:0.88rem; color:var(--ink-dim);}
  nav.links a{text-decoration:none; transition:color .2s;}
  nav.links a:hover{color:var(--ink);}
  .nav-status{font-family:var(--mono); font-size:0.72rem; color:var(--ink-dim); display:flex; align-items:center; gap:6px;}
  .dot{width:6px; height:6px; border-radius:50%; background:#e9e9e4; box-shadow:0 0 8px 1px rgba(233,233,228,0.6);}

  @media (max-width:760px){ nav.links{display:none;} }

  /* HERO */
  .hero{
    padding:180px 0 110px;
    text-align:center;
    position:relative;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(242,242,238,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242,242,238,0.05) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 700px 420px at 50% 20%, black, transparent 75%);
    pointer-events:none;
  }
  .emblem-hero{width:132px; height:auto; margin:0 auto 34px; position:relative; z-index:1; display:block; mix-blend-mode:screen;}
  .kicker{
    font-family:var(--mono); font-size:0.78rem; color:var(--ink-dim);
    letter-spacing:0.04em; margin-bottom:18px; position:relative; z-index:1;
  }
  h1.title{
    font-family:var(--serif); font-weight:600; font-size:clamp(2.6rem, 6vw, 4.6rem);
    letter-spacing:-0.01em; margin:0 0 20px; line-height:1.04; position:relative; z-index:1;
  }
  .title em{font-style:italic; font-weight:400; color:var(--ink-dim);}
  .lede{
    max-width:620px; margin:0 auto 40px; color:var(--ink-dim);
    font-size:1.08rem; line-height:1.7; position:relative; z-index:1;
  }
  .stat-row{
    display:flex; justify-content:center; gap:0; flex-wrap:wrap;
    position:relative; z-index:1; margin-top:8px;
  }
  .stat{
    padding:0 32px; text-align:left; border-left:1px solid var(--line);
  }
  .stat:first-child{border-left:none;}
  .stat .num{font-family:var(--serif); font-size:1.7rem; font-weight:500;}
  .stat .lbl{font-family:var(--mono); font-size:0.7rem; color:var(--ink-faint); margin-top:4px;}
  @media (max-width:640px){
    .stat{padding:14px 20px; border-left:none; border-top:1px solid var(--line); flex:1 1 40%;}
    .stat:first-child{border-top:none;}
  }

  /* SECTION SHELL */
  section{padding:96px 0; border-bottom:1px solid var(--line);}
  section:last-of-type{border-bottom:none;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:24px; margin-bottom:52px; flex-wrap:wrap;}
  .section-head .idx{font-family:var(--mono); font-size:0.76rem; color:var(--ink-faint);}
  h2.h{font-family:var(--serif); font-weight:500; font-size:clamp(1.7rem, 3vw, 2.3rem); margin:0; letter-spacing:-0.01em;}

  /* GLASS PANEL */
  .panel{
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:2px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }

  /* SEJARAH */
  .history-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:60px; align-items:start;}
  @media (max-width:820px){ .history-grid{grid-template-columns:1fr;} }
  .history-text p{color:var(--ink-dim); margin:0 0 20px; max-width:60ch;}
  .history-text strong{color:var(--ink); font-weight:500;}
  .pull{
    padding:28px 30px;
    border-left:2px solid var(--line-strong);
    font-family:var(--serif); font-size:1.25rem; font-style:italic; color:var(--ink);
    line-height:1.5;
  }
  .pull span{display:block; margin-top:14px; font-family:var(--mono); font-style:normal; font-size:0.72rem; color:var(--ink-faint);}

  /* STRUKTUR */
  .konsul-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); margin-bottom:1px;
  }
  .konsul-cell{background:var(--bg-soft); padding:26px 24px; text-align:center;}
  .konsul-cell .role{font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint); margin-bottom:10px;}
  .konsul-cell .name{font-family:var(--serif); font-size:1.15rem;}
  @media (max-width:700px){ .konsul-row{grid-template-columns:1fr;} }

  .branches{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:36px;}
  @media (max-width:820px){ .branches{grid-template-columns:1fr;} }
  .branch{padding:30px 26px;}
  .branch .tag{font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint); border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px;}
  .branch h3{font-family:var(--serif); font-weight:500; font-size:1.25rem; margin:0 0 14px;}
  .role-line{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:0.92rem;}
  .role-line:first-of-type{border-top:none;}
  .role-line .rl-role{color:var(--ink-dim);}
  .role-line .rl-name{text-align:right;}
  .branch .note{margin-top:16px; font-size:0.86rem; color:var(--ink-faint); line-height:1.6;}

  /* TIMELINE / VOTING */
  .timeline-wrap{display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center;}
  @media (max-width:820px){ .timeline-wrap{grid-template-columns:1fr;} }
  .era-ballot{display:flex; flex-direction:column;}
  .era-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 4px; border-top:1px solid var(--line); cursor:default;
  }
  .era-row:first-child{border-top:none;}
  .era-year{font-family:var(--serif); font-size:1.6rem; color:var(--ink-dim); transition:color .2s;}
  .era-row.active .era-year{color:var(--ink);}
  .era-meter{flex:1; margin:0 22px; height:1px; background:var(--line); position:relative;}
  .era-meter i{position:absolute; left:0; top:-1px; height:3px; background:var(--ink); display:block;}
  .era-pct{font-family:var(--mono); font-size:0.78rem; color:var(--ink-faint); width:44px; text-align:right;}
  .timeline-copy p{color:var(--ink-dim); margin:0 0 18px;}

  /* NEGARA */
  .country-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px;}
  .country{
    padding:22px 22px 20px; display:flex; flex-direction:column; gap:14px;
    transition:background .2s, border-color .2s;
  }
  .country:hover{background:var(--glass-hover); border-color:var(--line-strong);}
  .country .mark{
    width:38px; height:38px; border:1px solid var(--line-strong); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:1rem;
  }
  .country .cname{font-size:0.95rem;}
  .country .ctag{font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint);}

  /* PERISTIWA */
  .events{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line);}
  .event{background:var(--bg-soft); padding:34px 32px; display:grid; grid-template-columns:120px 1fr; gap:28px;}
  @media (max-width:700px){ .event{grid-template-columns:1fr; gap:10px;} }
  .event .eyear{font-family:var(--mono); font-size:0.8rem; color:var(--ink-faint); padding-top:4px;}
  .event h3{font-family:var(--serif); font-weight:500; font-size:1.3rem; margin:0 0 10px;}
  .event p{color:var(--ink-dim); margin:0; max-width:62ch;}

  /* FOOTER */
  footer{padding:70px 0 50px;}
  .foot-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:40px; margin-bottom:50px;}
  @media (max-width:760px){ .foot-grid{grid-template-columns:1fr; gap:32px;} }
  .foot-emblem{width:44px; height:auto; margin-bottom:16px; display:block; mix-blend-mode:screen;}
  footer h4{font-family:var(--mono); font-size:0.7rem; color:var(--ink-faint); margin:0 0 14px; font-weight:400;}
  footer .foot-col p, footer .foot-col a{display:block; color:var(--ink-dim); font-size:0.9rem; text-decoration:none; margin-bottom:8px;}
  .foot-bottom{border-top:1px solid var(--line); padding-top:24px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-family:var(--mono); font-size:0.72rem; color:var(--ink-faint);}

  .reveal{opacity:0; transform:translateY(14px); transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1; transform:none;}
  @media (prefers-reduced-motion: reduce){ .reveal{opacity:1; transform:none; transition:none;} html{scroll-behavior:auto;} }

  a:focus-visible, button:focus-visible{outline:1px solid var(--ink); outline-offset:3px;}
</style>
</head>
